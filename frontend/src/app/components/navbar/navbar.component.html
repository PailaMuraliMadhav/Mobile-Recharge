<header class="topbar">
  <div class="topbar-left">
    <button class="hamburger-btn" (click)="toggleSidebar()">☰</button>
  </div>

  <div class="topbar-right">
    <!-- Dark Mode Toggle -->
    <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      {{ isDark ? '☀️' : '🌙' }}
    </button>

    <!-- Logout text button -->
    <button class="logout-text-btn" (click)="requestLogout()">Logout</button>
  </div>
</header>

<!-- Logout Confirmation -->
<div class="modal-overlay" *ngIf="showLogoutConfirm" (click)="cancelLogout()">
  <div class="modal" (click)="$event.stopPropagation()"
    style="max-width:340px;text-align:center;padding:2rem">
    <h3 style="margin-bottom:0.5rem;font-size:1.2rem">Logout?</h3>
    <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1.5rem">
      Are you sure you want to log out?
    </p>
    <div style="display:flex;gap:0.75rem;justify-content:center">
      <button class="btn btn-danger" (click)="confirmLogout()">Yes, Logout</button>
      <button class="btn btn-ghost"  (click)="cancelLogout()">Cancel</button>
    </div>
  </div>
</div>
