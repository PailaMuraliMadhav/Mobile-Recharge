<div class="auth-page">
  <div class="auth-top-bar">
    <a routerLink="/" class="auth-home-link">← Back to Home</a>
    <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      {{ isDark ? '☀️' : '🌙' }}
    </button>
  </div>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><img src="assets/logo.svg" alt="OmniRecharge" class="auth-logo-img" /></div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your OmniRecharge account</p>
    </div>

    <div class="alert alert-danger" *ngIf="error">
      ⚠️ {{ error }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
        <div class="form-error" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required</span>
          <span *ngIf="email?.errors?.['email']">Enter a valid email address</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-with-action">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button type="button" class="input-action-btn" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <div class="form-error" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" [disabled]="loading">
        <span class="spinner spinner-sm" *ngIf="loading"></span>
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing in...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>
</div>
